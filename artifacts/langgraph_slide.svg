<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#245b4b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd8254"/></marker></defs>
<rect width="1920" height="1080" fill="#f7faf8"/><g font-family="Malgun Gothic, sans-serif" fill="#173b31">
<text x="100" y="108" font-size="48" font-weight="700">LangGraph 기반 질문 처리 흐름</text><text x="102" y="156" font-size="25" fill="#648177">공유 State를 갱신하고 두 조건에 따라 실행 경로를 선택</text>
<rect x="100" y="207" width="1720" height="74" rx="18" fill="#e5f2ec"/><text x="135" y="254" font-size="27">Streamlit 질문  →  run(question)  →  _initial_state()  →  graph.invoke()  →  START</text>
<rect x="100" y="345" width="320" height="240" rx="22" fill="#fff" stroke="#76b79d" stroke-width="3"/><text x="130" y="395" font-size="33" font-weight="700">interpret</text><text x="130" y="441" font-size="23">카탈로그 · 후보 검색</text><text x="130" y="478" font-size="23">벡터 + 키워드 → RRF</text><text x="130" y="515" font-size="23">LLM 의도 · ID 선택</text><text x="130" y="552" font-size="23">ID 검증 · 조회 조건 구성</text>
<rect x="525" y="345" width="320" height="240" rx="22" fill="#fff" stroke="#76b79d" stroke-width="3"/><text x="555" y="395" font-size="33" font-weight="700">retrieve</text><text x="555" y="441" font-size="23">선택 ID · 섹션으로 조회</text><text x="555" y="478" font-size="23">Neo4j 혜택 · 규칙 · 한도</text><text x="555" y="515" font-size="23">PDF 근거 병합</text><text x="555" y="552" font-size="23">미확정 조건 분류</text>
<rect x="950" y="345" width="320" height="240" rx="22" fill="#fff" stroke="#76b79d" stroke-width="3"/><text x="980" y="395" font-size="33" font-weight="700">answer</text><text x="980" y="441" font-size="23">혜택 · 근거 문맥 구성</text><text x="980" y="478" font-size="23">Answer LLM 호출</text><text x="980" y="515" font-size="23">구조화 답변 생성</text><text x="980" y="552" font-size="23">답변 · 호출 정보 갱신</text>
<rect x="1460" y="345" width="330" height="240" rx="22" fill="#e5f2ec" stroke="#245b4b" stroke-width="3"/><text x="1490" y="395" font-size="33" font-weight="700">finish</text><text x="1490" y="441" font-size="23">답변 또는 오류 안내</text><text x="1490" y="478" font-size="23">실행 경로 · LLM 통계</text><text x="1490" y="515" font-size="23">END → 최종 State 반환</text>
<path d="M420 465H525 M845 465H950 M1270 465H1460" stroke="#245b4b" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="427" y="420" font-size="20">대상 있음</text><text x="851" y="420" font-size="20">근거 있음</text><text x="425" y="310" font-size="19" fill="#4e7d6c">after_interpret</text><text x="850" y="310" font-size="19" fill="#4e7d6c">after_retrieve</text>
<path d="M260 585V680H1625V585 M685 585V645H1625" stroke="#bd8254" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="310" y="716" font-size="22" fill="#95643e">오류 · UNKNOWN · 대상 없음</text><text x="850" y="635" font-size="22" fill="#95643e">오류 또는 근거 없음</text>
<rect x="100" y="790" width="1720" height="112" rx="18" fill="#173b31"/><text x="135" y="834" font-size="25" fill="#a7ddc6" font-weight="700">공유 CardState</text><text x="135" y="874" font-size="24" fill="#fff">question · intent · search_parameters · retrieved_data · evidence · answer · path</text>
<text x="102" y="956" font-size="22" fill="#56776b">각 노드는 변경된 필드만 반환 → LangGraph가 State에 병합</text><text x="102" y="1001" font-size="21" fill="#789087">그래프 외부: Streamlit 실행 후 설정에 따라 PostgreSQL app_log 저장</text><text x="1760" y="1001" font-size="22" fill="#789087">16</text></g></svg>
